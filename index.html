
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FantaBike</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first race app — dark "asphalt" header band with road dashes, white stage cards, bottom tab bar; jerseys and profiles drawn in SVG */
:root{
  --bg:#eceff3;--surface:#ffffff;--surface2:#f5f7fa;--ink:#10151f;--muted:#5b6474;--line:rgba(16,21,31,.10);
  --road:#151b27;--road2:#232c3c;--onroad:#f3f5f8;--dash:#ffd400;
  --green:#0a9a55;--kom:#e2231a;--white-j:#fbfbfd;
  --lead:#d6001c;--lead-ink:#ffffff;--lead-soft:rgba(214,0,28,.12);
  --sky1:#cfe3f5;--sky2:#f3f7fb;--hill:#c9d3df;--hill2:#9fb0c4;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e15;--surface:#141a25;--surface2:#1a2130;--ink:#edf1f7;--muted:#8f99ab;--line:rgba(255,255,255,.09);
  --road:#05080d;--road2:#121926;--onroad:#f3f5f8;--sky1:#1b2a3d;--sky2:#141c29;--hill:#2a3648;--hill2:#3b4a60;--white-j:#f1f2f6;
  --lead-soft:rgba(255,60,80,.16);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e15;--surface:#141a25;--surface2:#1a2130;--ink:#edf1f7;--muted:#8f99ab;--line:rgba(255,255,255,.09);
  --road:#05080d;--road2:#121926;--onroad:#f3f5f8;--sky1:#1b2a3d;--sky2:#141c29;--hill:#2a3648;--hill2:#3b4a60;--white-j:#f1f2f6;
  --lead-soft:rgba(255,60,80,.16);color-scheme:dark}
:root[data-race="tour"]{--lead:#ffd200;--lead-ink:#111111;--lead-soft:rgba(255,210,0,.22);--dash:#ffffff}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--road);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lead);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:800;font-style:italic;letter-spacing:.2px;margin:0;text-wrap:balance;line-height:1}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* header band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--road);color:var(--onroad);
  padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top::after{content:"";display:block;height:4px;margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;
  background:repeating-linear-gradient(90deg,var(--dash) 0 22px,transparent 22px 40px);opacity:.9}
.bar{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;letter-spacing:.3px;line-height:1}
.logo i{color:var(--lead);font-style:italic}
:root[data-race="tour"] .logo i{color:var(--lead)}
.logo svg{width:30px;height:30px;flex:none}
.sp{flex:1}
.seg{display:inline-flex;background:var(--road2);border-radius:999px;padding:3px;gap:2px}
.seg button{font:700 12px/1 var(--body);letter-spacing:.6px;text-transform:uppercase;padding:7px 10px;border-radius:999px;color:#aab4c4}
.seg button[aria-pressed="true"]{background:var(--onroad);color:#10151f}
.race-sw{margin-top:10px;display:flex;gap:8px}
.race-sw button{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--road2);color:#c5ceda;text-align:left}
.race-sw button[aria-pressed="true"]{background:var(--onroad);color:#10151f}
.race-sw b{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;line-height:1;display:block}
.race-sw small{font-size:11px;opacity:.75;display:block}
.race-sw svg{width:28px;height:28px;flex:none}

/* page */
.pg>*{min-width:0}
.pg{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 8px;display:grid;gap:18px}
.eyebrow{font:700 11px/1 var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:26px}
.sec-h .eyebrow{white-space:nowrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(10,20,40,.35)}
.muted{color:var(--muted)}

/* hero stage */
.hero{overflow:hidden;position:relative}
.hero .hd{padding:14px 16px 0;display:flex;gap:10px;align-items:flex-start}
.hero .stg{background:var(--lead);color:var(--lead-ink);font-family:var(--display);font-style:italic;font-weight:900;border-radius:10px;padding:6px 9px 4px;text-align:center;line-height:.9;flex:none}
.hero .stg small{display:block;font-size:10px;letter-spacing:1px;font-style:normal;font-weight:700}
.hero .stg b{font-size:30px}
.hero h1{font-size:30px}
.hero h1 .arr{color:var(--lead);padding:0 4px}
:root[data-race="tour"] .hero h1 .arr{color:#c9a400}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.k{background:var(--lead-soft);color:var(--ink)}
.prof{display:block;width:100%;height:auto;margin-top:6px}
.hero .win{display:flex;align-items:center;gap:12px;padding:12px 16px 14px;border-top:1px dashed var(--line)}
.win{flex-wrap:wrap}.win .t{flex:1;min-width:0}
.win b{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;line-height:1}

/* jerseys row */
.jrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jc{padding:12px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.jc svg{width:72px;height:72px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.jc .lbl{font:700 10px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.jc .who{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc .val{font:600 12px/1.2 var(--mono)}

/* road progress */
.road{padding:14px 14px 12px}
.road svg{display:block;width:100%;height:auto}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;padding:16px 12px 0}
.pod{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod svg.j{width:58px;height:58px}
.pod .n{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .g{font:500 11px/1 var(--mono);color:var(--muted)}
.step{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;color:var(--lead-ink);background:var(--lead)}
.pod:nth-child(1) .step{height:58px;background:#9aa6b6;color:#fff}
.pod:nth-child(2) .step{height:84px}
.pod:nth-child(3) .step{height:44px;background:#b9773f;color:#fff}

/* standings list */
.tabsJ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabsJ button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:12px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tabsJ button svg{width:44px;height:44px}
.tabsJ button span{font:700 11px/1 var(--body);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.tabsJ button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.lead-b{display:flex;align-items:center;gap:14px;padding:14px 16px;color:var(--lead-ink);background:var(--lead);border-radius:var(--r);position:relative;overflow:hidden}
.lead-b.verde{background:var(--green);color:#fff}
.lead-b.pois{background:var(--white-j);color:#10151f;background-image:radial-gradient(circle,var(--kom) 0 7px,transparent 7.5px);background-size:30px 30px;background-position:6px 4px}
.lead-b.pois .t{background:var(--white-j);border-radius:10px;padding:6px 10px}
.lead-b svg{width:84px;height:84px;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.lead-b .t{min-width:0}
.lead-b h3{font-size:32px}
.lead-b .v{font:600 15px/1.2 var(--mono);margin-top:4px}
.lst{list-style:none;margin:0;padding:6px 0}
.lst li{display:grid;grid-template-columns:30px 36px 1fr auto;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.lst li:first-child{border-top:0}
.lst .pos{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;text-align:center;line-height:1}
.lst svg.j{width:36px;height:36px}
.lst .nm{min-width:0}
.lst .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .r{text-align:right;font:600 13px/1.25 var(--mono)}
.lst .r small{display:block;font:500 11px/1.2 var(--mono);color:var(--muted)}
.mv{font:700 11px/1 var(--body);display:inline-block;min-width:24px}
.mv.up{color:var(--green)}.mv.dn{color:var(--kom)}.mv.eq{color:var(--muted)}
.lst li.tap{cursor:pointer}
.lst li.tap:hover{background:var(--surface2)}

/* bump chart */
.chart{padding:12px 6px 8px}
.chart .wrap{overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 6px}
.legend button{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--surface2)}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* stages */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;margin:0 -2px}
.strip button{flex:none;width:74px;scroll-snap-align:center;background:var(--surface);border-radius:12px;padding:8px 6px 6px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.strip button b{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;line-height:1}
.strip button small{font:600 10px/1 var(--body);color:var(--muted);letter-spacing:.4px}
.strip button svg{width:60px;height:22px}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.strip button[aria-pressed="true"] small{color:inherit;opacity:.7}
.strip button .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.strip button .dot.fut{background:var(--line)}
.strip button .dot.neu{background:#f0a500}
.note{padding:12px 14px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:13.5px}
.res li{grid-template-columns:30px 1fr auto}
.res .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:2px}
.res .rider{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.res .rider svg{width:18px;height:18px}
.tag{font:700 10px/1 var(--body);letter-spacing:.6px;padding:3px 5px;border-radius:5px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.g{background:rgba(10,154,85,.14);color:var(--green)}
.tag.k{background:rgba(226,35,26,.12);color:var(--kom)}
.tag.b{background:var(--lead-soft);color:var(--ink)}

/* teams */
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tm{padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;overflow:hidden}
.tm svg.j{width:64px;height:64px;position:absolute;right:-4px;top:6px;opacity:.95}
.tm .rk{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;line-height:1}
.tm b{font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;line-height:1.05;padding-right:52px}
.tm small{color:var(--muted);font-size:12px;padding-right:52px}
.tm .ic{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tm .ic span{font:600 11px/1 var(--mono);padding:4px 6px;border-radius:6px;background:var(--surface2)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(5,8,13,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;transform:translateY(102%);transition:transform .25s ease;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto}
.sh-hd{display:flex;gap:14px;align-items:center;padding:6px 16px 14px}
.sh-hd svg{width:96px;height:96px;flex:none}
.sh-hd h2{font-size:30px}
.sh-body{padding:0 16px;display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;text-align:center}
.stat svg{width:30px;height:30px}
.stat b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1}
.stat small{font:500 11px/1.2 var(--mono);color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pk{padding:7px 8px;border-radius:10px;background:var(--surface);box-shadow:0 1px 0 var(--line);min-width:0}
.pk small{font:700 10px/1 var(--body);color:var(--muted);letter-spacing:.6px}
.pk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .p{font:500 11px/1 var(--mono);color:var(--muted)}
.pk.best{background:var(--lead);color:var(--lead-ink)}
.pk.best small,.pk.best .p{color:inherit;opacity:.8}
.close{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px}

/* rules */
.rules{padding:16px;display:grid;gap:14px}
.rule{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.rule svg{width:52px;height:52px}
.rule h3{font-size:21px;margin-bottom:3px}
.rule p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.formula{font:600 13px/1.4 var(--mono);background:var(--surface2);padding:10px 12px;border-radius:10px;overflow-x:auto}

/* countdown */
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
.cd div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.cd b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;line-height:1}
.cd small{font:700 10px/1 var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

/* pick */
.me{display:flex;align-items:center;gap:12px;padding:12px 14px}
.me svg.j{width:52px;height:52px;flex:none}
.me .t{flex:1;min-width:0}
.me b{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;line-height:1;display:block}
.lnk{font:600 12px/1 var(--body);color:var(--muted);text-decoration:underline;padding:6px}
.tm[disabled]{opacity:.45;cursor:not-allowed}
.tm .tk{font:700 10px/1 var(--body);letter-spacing:.8px;text-transform:uppercase;color:var(--kom)}
.pf{padding:14px 16px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-top:1px dashed var(--line)}
.pf label{font:700 11px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.pf .row{display:flex;gap:8px}
.pf input{flex:1;min-width:0;font:600 17px/1.2 var(--body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.pf input:focus{outline:none;border-color:var(--ink)}
.btn{font:800 15px/1 var(--display);font-style:italic;letter-spacing:.4px;text-transform:uppercase;padding:12px 16px;border-radius:12px;background:var(--lead);color:var(--lead-ink);white-space:nowrap}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.msg{font-size:13.5px;padding:8px 10px;border-radius:10px}
.msg.ok{background:rgba(10,154,85,.12);color:var(--green)}
.msg.err{background:rgba(226,35,26,.10);color:var(--kom)}
.cur{display:flex;align-items:center;gap:8px;font-size:14px}
.cur b{font-size:16px}
.used{display:flex;flex-wrap:wrap;gap:6px}
.used span{font:600 12px/1 var(--body);padding:6px 8px;border-radius:8px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.used small{color:var(--muted);font:600 10px/1 var(--mono);margin-right:4px}
.strip button .ck{position:absolute;top:5px;left:6px;font:900 11px/1 var(--body);color:var(--green)}
.qbtn{width:30px;height:30px;border-radius:50%;background:var(--road2);color:#c5ceda;font:800 15px/1 var(--body);display:grid;place-items:center}
.qbtn[aria-pressed="true"]{background:var(--onroad);color:#10151f}
.chosen{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.chosen span{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--body);padding:4px 8px 4px 4px;border-radius:999px;background:var(--surface2)}
.chosen span svg{width:20px;height:20px}
.chosen span.no{opacity:.4}

.rgrid{display:grid;grid-template-columns:minmax(70px,1.4fr) 1.3fr repeat(4,minmax(34px,.8fr)) 26px;gap:6px;align-items:center;overflow-x:auto}
.rgrid small{font:700 9px/1.1 var(--body);letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.rgrid b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgrid input{min-width:0;width:100%;font:600 13px/1 var(--mono);padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.rgrid input[type=checkbox]{width:20px;height:20px;padding:0}
/* tab bar */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tb div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font:600 10.5px/1 var(--body);letter-spacing:.3px;color:var(--muted);position:relative}
.tb button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb button[aria-current="page"]{color:var(--ink)}

/* ---------- compute ---------- */
function compute(R){
  const res=effRes(R), names=DTS.map(d=>d.n);
  const st=R.stages.map((s,i)=>{const r=res[i];if(!r||!Object.keys(r).length)return"fut";return Object.values(r).some(v=>v[1]>0)?"ok":"neu"});
  const last=st.lastIndexOf("ok")>=st.lastIndexOf("neu")?st.lastIndexOf("ok"):st.lastIndexOf("neu");
  const cum={gen:[],verde:[],pois:[]}, rank={gen:[],verde:[],pois:[]};
  const run={};names.forEach(n=>run[n]={t:0,g:0,p:0});
  const day=[];
  R.stages.forEach((s,i)=>{
    const r=res[i]||{};const rows=[];
    names.forEach(n=>{const v=r[n];if(!v)return;const tot=v[1]-v[2]+v[3];run[n].t+=tot;run[n].g+=v[4];run[n].p+=v[5];rows.push({n,rd:v[0],t:v[1],b:v[2],pe:v[3],tot,g:v[4],k:v[5],f:v[6]||""})});
    if(st[i]==="ok"){rows.sort((a,b)=>a.tot-b.tot);rows.forEach((x,j)=>x.gap=x.tot-rows[0].tot)}
    day.push(rows);
    const snap=n=>({...run[n]});
    cum.gen.push(Object.fromEntries(names.map(n=>[n,snap(n)])));
    if(st[i]!=="fut"){
      rank.gen[i]=ranker(names,n=>run[n].t,1);rank.verde[i]=ranker(names,n=>run[n].g,-1);rank.pois[i]=ranker(names,n=>run[n].p,-1);
    }
  });
  const totals=last>=0?cum.gen[last]:Object.fromEntries(names.map(n=>[n,{t:0,g:0,p:0}]));
  // stage wins per DT
  const wins={};names.forEach(n=>wins[n]=0);
  day.forEach((rows,i)=>{if(st[i]!=="ok")return;rows.filter(x=>x.gap===0).forEach(x=>wins[x.n]++)});
  return {st,last,day,cum,rank,totals,wins};
}
function ranker(names,f,dir){const s=[...names].sort((a,b)=>dir*(f(a)-f(b))||a.localeCompare(b));const o={};let p=0,prev=null;s.forEach((n,i)=>{const v=f(n);if(v!==prev){p=i+1;prev=v}o[n]=p});return o}
function standing(C,j,idx){
  const i=idx??C.last; if(i<0)return DTS.map(d=>({n:d.n,v:0,pos:"–"}));
  const tot=C.cum.gen[i], key={gen:"t",verde:"g",pois:"p"}[j], dir=j==="gen"?1:-1;
  const rk=C.rank[j][i];
  const prevI=(()=>{for(let k=i-1;k>=0;k--)if(C.rank[j][k])return k;return -1})();
  return DTS.map(d=>({n:d.n,v:tot[d.n][key],pos:rk[d.n],mv:prevI>=0?C.rank[j][prevI][d.n]-rk[d.n]:0})).sort((a,b)=>a.pos-b.pos||a.n.localeCompare(b.n));
}

/* seeded profile */
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function profilePts(s,N=60){
  const r=rng(s.n*7+(RID==="tour"?1000:0)+Math.round(s.km));const pts=[];
  const amp={flat:.12,hilly:.38,medium:.55,mountain:.9,itt:.15}[s.ty];
  const climbs={flat:0,hilly:5,medium:3,mountain:3,itt:1}[s.ty];
  const centers=[];for(let c=0;c<climbs;c++)centers.push({x:.12+r()*.8,h:amp*(.45+r()*.55),w:.04+r()*(s.ty==="mountain"?.07:.05)});
  if(s.top)centers.push({x:1,h:amp*(s.ty==="mountain"?1:.75),w:s.ty==="mountain"?.1:.06});
  for(let i=0;i<=N;i++){const x=i/N;let y=.08+r()*.03+(s.ty==="flat"?Math.sin(x*9+s.n)*.03:0);
    centers.forEach(c=>{y+=c.h*Math.exp(-((x-c.x)**2)/(2*c.w*c.w))});pts.push([x,Math.min(y,1)])}

}

function bump(R,C){
  const idx=[];C.rank[CJ].forEach((r,i)=>{if(r)idx.push(i)});
  const w=560,h=270,l=26,rgt=86,tp=14,bt=22;const X=k=>l+k*(w-l-rgt)/Math.max(1,idx.length-1),Y=p=>tp+(p-1)*(h-tp-bt)/9;
  let g="";for(let p=1;p<=10;p++)g+=`<line x1="${l}" x2="${w-rgt}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${l-8}" y="${Y(p)+3}" text-anchor="end" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${p}</text>`;
  idx.forEach((i,k)=>{if(k%2===0||k===idx.length-1)g+=`<text x="${X(k)}" y="${h-6}" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--muted)">T${i+1}</text>`});
  const lines=DTS.map(d=>{const pts=idx.map((i,k)=>[X(k),Y(C.rank[CJ][i][d.n])]);const on=!HL||HL===d.n;const c=KIT[d.n][0]==="#f5f5f4"?"#94a3b8":KIT[d.n][0];
    const last=pts[pts.length-1];
    return {on,svg:`<g opacity="${on?1:.13}"><path d="M${pts.map(p=>p.join(" ")).join(" L")}" fill="none" stroke="${c}" stroke-width="${HL===d.n?4:2.4}" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${HL===d.n?3.6:2.2}" fill="${c}"/>`).join("")}<text x="${last[0]+8}" y="${last[1]+4}" font-size="11" font-weight="700" font-family="Archivo,sans-serif" fill="var(--ink)">${esc(d.n)}</text></g>`}});
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("trend")}">${g}${lines.filter(x=>!x.on).map(x=>x.svg).join("")}${lines.filter(x=>x.on).map(x=>x.svg).join("")}</svg>`;
}

const TABS=["home","pick","cls","stg","teams","rules"];
/* ---------- picks (db) ---------- */
let DB=null,ME=null,PK={},DBS="loading",CANW=true,PSEL=null,BUSY=false,MSG=null;
const norm=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const lockAt=s=>new Date(s.d+"T12:00:00+02:00");
function isOpen(R,i){const r=R.res[i];return !(r&&Object.keys(r).length)&&!RESDB[R.id+"_"+R.stages[i].n]&&Date.now()<lockAt(R.stages[i])}
let RESDB={},ADMIN=false;
function findR(m,name){const k=norm(name);const e=Object.entries(m||{}).find(([a])=>norm(a)===k);return e?e[1]:null}
/* stage rows: Excel first; otherwise built from app picks + results entered by the organiser.
   No pick or rider out => time of the slowest DS of the stage, 0 points (S.E.) */
function effRes(R){return R.stages.map((s,i)=>{const x=R.res[i];if(x&&Object.keys(x).length)return x;
  const d=RESDB[R.id+"_"+s.n];if(!d||!d.riders)return null;const rows={};
  DTS.forEach(dt=>{const p=dbPick(R,dt.n,i);const r=p?findR(d.riders,p):null;
    if(r&&!r.out&&r.t>0)rows[dt.n]=[p,r.t,r.b||0,r.p||0,r.g||0,r.k||0,""];
    else rows[dt.n]=[p||"—",0,0,0,r?(r.g||0):0,r?(r.k||0):0,p?"RIT":"SE"]});
  const ok=Object.values(rows).filter(v=>!v[6]);const worst=ok.length?Math.max(...ok.map(v=>v[1]-v[2]+v[3])):0;
  Object.values(rows).forEach(v=>{if(v[6])v[1]=worst});return rows})}
function dups(R,dt){const m={};R.stages.forEach((s,i)=>{const p=pickOf(R,dt,i);if(!p||p==="—")return;const k=norm(p);(m[k]=m[k]||{rd:p,st:[]}).st.push(s.n)});return Object.values(m).filter(x=>x.st.length>1)}
const parseT=v=>{v=String(v||"").trim();if(!v)return 0;const p=v.split(/[^0-9]+/).filter(Boolean).map(Number);if(!p.length||p.length>3)return NaN;while(p.length<3)p.unshift(0);return p[0]*3600+p[1]*60+p[2]};
function resForm(R,i){
  const s=R.stages[i];const riders=[...new Set(DTS.map(d=>dbPick(R,d.n,i)).filter(Boolean))];
  if(!riders.length)return `<p class="note">${t("future")}</p>`;
  const cur=(RESDB[R.id+"_"+s.n]||{}).riders||{};
  return `<form class="pf rf" id="rf" data-i="${i}" autocomplete="off"><label>${t("resT")}</label><p class="muted" style="margin:0;font-size:13px">${t("resSub")}</p>
  <div class="rgrid"><span></span><small>${t("tArr")}</small><small>${t("bonus")} s</small><small>${t("pen")} s</small><small>${t("pts")}</small><small>${t("kom")}</small><small>${t("rit")}</small>
  ${riders.map((r,k)=>{const c=findR(cur,r)||{};return `<b data-rn="${esc(r)}">${esc(r)}</b><input id="rt${k}" aria-label="${t("tArr")} ${esc(r)}" placeholder="h:mm:ss" value="${c.t?hms(c.t):""}"><input id="rb${k}" type="number" min="0" value="${c.b||""}"><input id="rp${k}" type="number" min="0" value="${c.p||""}"><input id="rg${k}" type="number" min="0" value="${c.g||""}"><input id="rk${k}" type="number" min="0" value="${c.k||""}"><input id="ro${k}" type="checkbox" ${c.out?"checked":""}>`}).join("")}</div>
  ${MSG&&MSG[2]==="res"?`<div class="msg ${MSG[0]}">${MSG[1]}</div>`:""}
  <button class="btn" type="submit" ${BUSY?"disabled":""}>${t("resSave")}</button></form>`;
}
async function saveRes(f){
  const R=RACES[RID],i=+f.dataset.i,s=R.stages[i];const names=[...f.querySelectorAll("[data-rn]")].map(b=>b.dataset.rn);const riders={};
  for(let k=0;k<names.length;k++){const tv=parseT(f.querySelector("#rt"+k).value),out=f.querySelector("#ro"+k).checked;
    if(isNaN(tv)||(!out&&!tv)){MSG=["err",t("fmtErr").replace("{r}",esc(names[k])),"res"];render();return}
    const n=id=>Math.max(0,parseInt(f.querySelector("#"+id+k).value)||0);
    riders[names[k]]={t:tv,b:n("rb"),p:n("rp"),g:n("rg"),k:n("rk"),out}}
  BUSY=true;render();
  try{await DB.collection("results").doc(R.id+"_"+s.n).set({riders,ts:Date.now()});BUSY=false;MSG=["ok",t("resSaved"),"res"]}
  catch(e){BUSY=false;MSG=["err",t("saveErr"),"res"]}
  render();
}
function ownerOf(dt){let best=null;Object.entries(PK).forEach(([u,d])=>{if(d&&d.dt===dt&&(!best||(d.since||0)<(PK[best].since||0)))best=u});return best}
function myDt(){const d=PK[ME];return d&&d.dt&&ownerOf(d.dt)===ME?d.dt:null}
function dbPick(R,dt,i){const u=ownerOf(dt);const v=u&&PK[u]&&PK[u][R.id]&&PK[u][R.id][String(R.stages[i].n)];return v||null}
function pickOf(R,dt,i){const r=R.res[i];if(r&&r[dt])return r[dt][0];return dbPick(R,dt,i)}
function usedList(R,dt,except){const o=[];R.stages.forEach((s,i)=>{if(i===except)return;const p=pickOf(R,dt,i);if(p)o.push({n:s.n,rd:p})});return o}
function riderNames(){const set=new Map();VUELTA_DATA.res.forEach(r=>Object.values(r).forEach(v=>{const k=norm(v[0]);if(k&&!set.has(k))set.set(k,String(v[0]).trim())}));
  Object.values(PK).forEach(d=>["vuelta","tour"].forEach(k=>Object.values((d&&d[k])||{}).forEach(v=>{const n=norm(v);if(n&&!set.has(n))set.set(n,v)})));
  return [...set.values()].sort((a,b)=>a.localeCompare(b))}
function countdown(dt){let ms=Math.max(0,dt-Date.now());const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return (d?d+"g ":"").replace("g",L==="it"?"g":"d")+h+"h "+String(m).padStart(2,"0")+"m"}

function futBody(R,i){
  const open=isOpen(R,i), me=myDt();

  const any=DTS.some(d=>dbPick(R,d.n,i));

}

    return `<section class="fade"><div class="sec-h"><h2>${t("who")}</h2></div><p class="muted" style="margin:0 0 12px">${t("whoSub")}</p>
    ${MSG?`<div class="msg ${MSG[0]}" style="margin-bottom:10px">${MSG[1]}</div>`:""}
    <div class="teams">${DTS.map(d=>{const o=ownerOf(d.n);const tk=o&&o!==ME;return `<button class="card tm" data-claim="${esc(d.n)}" ${tk||!CANW?"disabled":""}>${jersey(d.n)}<b>${esc(d.n)}</b><small>${esc(d.t)}</small>${tk?`<span class="tk">${t("taken")}</span>`:""}</button>`}).join("")}</div></section>`;
  }
  const open=R.stages.map((s,i)=>i).filter(i=>isOpen(R,i));
  const head=`<div class="card me fade">${jersey(me)}<div class="t"><div class="eyebrow">${t("ds")}</div><b>${esc(me)}</b><small class="muted">${esc(DTS.find(d=>d.n===me).t)}</small></div><button class="lnk" data-unclaim="1">${t("change")}</button></div>`;
  if(!CANW)return head+`<p class="note">${t("readonly")}</p>`;
  if(!open.length)return head+`<p class="note">${t("noOpen")}</p>`;
  if(PSEL==null||!open.includes(PSEL))PSEL=open[0];
  const s=R.stages[PSEL],cur=dbPick(R,me,PSEL);
  const strip=open.map(i=>{const st=R.stages[i];const has=dbPick(R,me,i);return `<button data-ps="${i}" aria-pressed="${i===PSEL}" aria-label="${t("stage")} ${st.n}">${has?'<span class="ck">✓</span>':""}<b>${st.n}</b>${profileSVG(st,60,22,{mini:true})}<small>${dfmt(st.d).replace(/\.$/,"")}</small></button>`}).join("");
  const used=usedList(R,me,-1);const dd=dups(R,me);
  return `${head}<div class="strip">${strip}</div>
  <section class="card hero fade"><div class="hd"><div class="stg"><small>${t("stage").toUpperCase()}</small><b>${s.n}</b></div><div style="min-width:0"><div class="eyebrow">${t("closesIn")} · ${countdown(lockAt(s))}</div><h1>${stageTitle(s)}</h1>${stageMeta(s)}</div></div>
  ${profileSVG(s,340,110)}
  <form class="pf" id="pf" autocomplete="off"><label for="rin">${t("yourPick")}</label>
   ${cur?`<div class="cur">${jersey(me).replace('class="j"','class="j" style="width:26px;height:26px"')}<span class="muted">${t("nowPick")}:</span><b>${esc(cur)}</b></div>`:""}
   <div class="row"><input id="rin" name="rin" list="riders" placeholder="${t("ph")}" value="${cur?esc(cur):""}"><button class="btn" type="submit" ${BUSY?"disabled":""}>${t("save")}</button></div>
   ${MSG?`<div class="msg ${MSG[0]}">${MSG[1]}</div>`:""}
   ${cur?`<button type="button" class="lnk" style="justify-self:start" data-clear="1">${t("clear")}</button>`:""}
  </form></section>
  ${dd.map(x=>`<div class="msg err">${t("dupT")}: ${esc(x.rd)} (${x.st.map(k=>"T"+k).join(", ")})</div>`).join("")}
  <p class="note" style="margin:0">${t("lockNote")}</p>
  ${used.length?`<section><div class="eyebrow" style="margin-bottom:8px">${t("used")} (${used.length})</div><div class="used">${used.map(u=>`<span><small>T${u.n}</small>${esc(u.rd)}</span>`).join("")}</div></section>`:""}`;
}
async function writeMine(patch,create){
  if(!DB||BUSY)return false;BUSY=true;render();
  try{const ref=DB.collection("picks").doc(ME);if(create||!PK[ME])await ref.set(patch);else await ref.update(patch);BUSY=false;return true}
  catch(e){BUSY=false;MSG=["err",t("saveErr")];render();return false}
}
async function claim(dt){MSG=null;const o=ownerOf(dt);if(o&&o!==ME){MSG=["err",t("takenErr")];render();return}
  const cur=PK[ME]||{};await writeMine({...cur,dt,since:Date.now()},true);render()}
async function savePick(val){
  const R=RACES[RID],me=myDt(),s=R.stages[PSEL];val=String(val||"").replace(/\s+/g," ").trim();
  if(!val){MSG=["err",t("empty")];render();return}
  if(!isOpen(R,PSEL)){render();return}
  const dup=usedList(R,me,PSEL).find(u=>norm(u.rd)===norm(val));
  if(dup){MSG=["err",t("usedErr").replace("{r}",esc(dup.rd)).replace("{n}",dup.n)];render();return}
  const known=riderNames().find(n=>norm(n)===norm(val));if(known)val=known;
  if(await writeMine({[R.id]:{[String(s.n)]:val}},false)){MSG=["ok",t("saved")+" · "+esc(val)];render()}
}
async function clearPick(){const R=RACES[RID];if(!isOpen(R,PSEL))return;if(await writeMine({[R.id]:{[String(R.stages[PSEL].n)]:""}},false)){MSG=null;render()}}
(async()=>{
  try{
    if(!window.claude||!window.claude.use){DBS="off";render();return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){DBS="off";render();return}
    ME=await user.id();if(!ME){DBS="off";render();return}
    try{const c=await user.can("data.write");CANW=c!==false}catch(e){}
    DB=db;try{ADMIN=(await user.isOwner())||(await user.canEdit())}catch(e){}
    db.collection("results").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});RESDB=o;render()},()=>{});
    db.collection("picks").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});PK=o;DBS="on";render()},()=>{DBS="off";render()});
  }catch(e){DBS="off";render()}
})();
function render(){
  document.documentElement.dataset.race=RID;document.documentElement.lang=L;
  ["it","es"].forEach(l=>$("#l-"+l).setAttribute("aria-pressed",L===l));
  $("#racesw").innerHTML=Object.values(RACES).map(r=>`<button data-race="${r.id}" aria-pressed="${RID===r.id}">${jersey(r.lead==="rossa"?"rossa":"gialla")}<span><b>${esc(r.short)}</b><small>${r.sub}</small></span></button>`).join("");
  $("#qb").setAttribute("aria-pressed",TAB==="rules");
  $("#riders").innerHTML=riderNames().map(n=>`<option value="${esc(n)}">`).join("");
  const inp=document.getElementById("rin"),keep=inp?{v:inp.value,f:document.activeElement===inp,st:PSEL,r:RID}:null;
  $("#tb").innerHTML=TABS.filter(k=>k!=="rules").map(k=>`<button data-tab="${k}" ${TAB===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${icon(k)}</svg>${t(k)}</button>`).join("");
  const R=RACES[RID],C=compute(R);
  $("#m").innerHTML={home:vHome,pick:vPick,cls:vCls,stg:vStg,teams:vTeams,rules:vRules}[TAB](R,C);
  const ni=document.getElementById("rin");if(ni&&keep&&keep.st===PSEL&&keep.r===RID){ni.value=keep.v;if(keep.f)ni.focus()}
  if(TAB==="stg"){const b=document.querySelector('#strip [aria-pressed="true"]');if(b)b.scrollIntoView({inline:"center",block:"nearest"})}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-l],[data-race],[data-tab],[data-j],[data-s],[data-dt],[data-hl],[data-go],[data-claim],[data-unclaim],[data-ps],[data-clear],[data-gopick]");if(!b||b===document.documentElement)return;
  if(b.dataset.claim){if(!b.disabled)claim(b.dataset.claim);return}
  if(b.dataset.unclaim){MSG=null;writeMine({dt:null},false).then(()=>render());return}
  if(b.dataset.clear){clearPick();return}
  if(b.dataset.ps){PSEL=+b.dataset.ps;MSG=null;render();return}
  if(b.dataset.gopick){PSEL=+b.dataset.gopick;MSG=null;TAB="pick";history.replaceState(null,"","#pick");window.scrollTo(0,0);render();return}
  MSG=null;
  if(b.dataset.l){L=b.dataset.l;ls.set("fb-l",L)}
  else if(b.dataset.race){RID=b.dataset.race;ls.set("fb-r",RID);SEL=null;HL=null;PSEL=null}
  else if(b.dataset.tab){TAB=b.dataset.tab;if(location.hash!=="#"+TAB)history.replaceState(null,"","#"+TAB);window.scrollTo(0,0)}
  else if(b.dataset.go){TAB=b.dataset.go;if(b.dataset.j)CJ=b.dataset.j;window.scrollTo(0,0)}
  else if(b.dataset.j){CJ=b.dataset.j}
  else if(b.dataset.s){SEL=+b.dataset.s}
  else if(b.dataset.hl){HL=HL===b.dataset.hl?null:b.dataset.hl}
  else if(b.dataset.dt){openDT(b.dataset.dt);return}
  render();
});
document.addEventListener("submit",e=>{if(e.target.id==="pf"){e.preventDefault();savePick(e.target.rin.value)}else if(e.target.id==="rf"){e.preventDefault();saveRes(e.target)}});
$("#ov").onclick=closeDT;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDT()});
function fromHash(){const h=location.hash.slice(1);if(TABS.includes(h))TAB=h}
window.addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();
</script>
