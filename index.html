<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>FantaBike</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: native-style phone app — translucent dark app bar, iOS-like large titles, edge-to-edge illustrated stage hero,
   inset grouped lists, floating pill tab bar, swipeable bottom sheets. Race colour (red Vuelta / yellow Tour) drives the accent. */
:root{
  --bg:#f1f2f6;--surface:#ffffff;--surface2:#eef0f5;--surface3:#e4e7ee;--ink:#0e131c;--ink2:#2a3240;--muted:#6b7383;--line:rgba(14,19,28,.08);
  --bar:rgba(14,19,28,.84);--bar-ink:#f4f6fa;--bar-mute:#9aa4b4;--tabbar:rgba(255,255,255,.82);
  --green:#0b9b56;--kom:#e3241b;--blue:#2f6fe4;--amber:#f2a900;
  --lead:#d90a1e;--lead2:#a30616;--lead-ink:#ffffff;--lead-soft:rgba(217,10,30,.11);
  --g1:#3fbf6a;--g2:#f4c430;--g3:#f2862e;--g4:#e2412f;--g5:#8e1b2c;
  --sc-sky1:#8cc4ef;--sc-sky2:#eaf4fb;--sc-far:#a9bfd6;--sc-mid:#7fa889;--sc-land1:#5f9a5b;--sc-land2:#3f7442;--sc-snow:#ffffff;--sc-sun:#fff4c4;--sc-sea:#5fa9d6;--sc-cloud:#ffffff;--sc-road:#3a3f48;
  --skin:#cf966f;--shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(14,30,60,.35);
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080b11;--surface:#131923;--surface2:#1b2230;--surface3:#252e3e;--ink:#eef2f8;--ink2:#cfd6e2;--muted:#8a94a6;--line:rgba(255,255,255,.08);
  --bar:rgba(8,11,17,.82);--tabbar:rgba(19,25,35,.84);--lead-soft:rgba(255,70,90,.16);
  --sc-sky1:#152a4a;--sc-sky2:#3b4f72;--sc-far:#2c3e58;--sc-mid:#26443a;--sc-land1:#2c4f33;--sc-land2:#1c3523;--sc-snow:#c9d6e6;--sc-sun:#f3e6b0;--sc-sea:#1d4366;--sc-cloud:#8090a8;--sc-road:#151a22;
  --shadow:0 1px 0 var(--line);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080b11;--surface:#131923;--surface2:#1b2230;--surface3:#252e3e;--ink:#eef2f8;--ink2:#cfd6e2;--muted:#8a94a6;--line:rgba(255,255,255,.08);
  --bar:rgba(8,11,17,.82);--tabbar:rgba(19,25,35,.84);--lead-soft:rgba(255,70,90,.16);
  --sc-sky1:#152a4a;--sc-sky2:#3b4f72;--sc-far:#2c3e58;--sc-mid:#26443a;--sc-land1:#2c4f33;--sc-land2:#1c3523;--sc-snow:#c9d6e6;--sc-sun:#f3e6b0;--sc-sea:#1d4366;--sc-cloud:#8090a8;--sc-road:#151a22;
  --shadow:0 1px 0 var(--line);color-scheme:dark}
:root[data-race="tour"]{--lead:#ffd000;--lead2:#d9ab00;--lead-ink:#141414;--lead-soft:rgba(255,208,0,.2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);overscroll-behavior-y:none}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;margin:0;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0e131c;z-index:40}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.press{transition:transform .14s var(--ease),background-color .14s}
.press:active{transform:scale(.97)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
h1,h2,h3{font-family:var(--display);font-weight:800;font-style:italic;margin:0;line-height:1;text-wrap:balance;letter-spacing:.1px}
.muted{color:var(--muted)}
svg{display:block}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--bar-ink);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--lead) 0 33%,var(--green) 33% 66%,var(--kom) 66%);opacity:.95}
.ab{max-width:600px;margin:0 auto;height:54px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.racechip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(255,255,255,.1)}
.racechip svg.j{width:26px;height:26px}
.racechip b{font:800 italic 17px/1 var(--display);letter-spacing:.2px}
.racechip i{font-style:normal;opacity:.6;font-size:11px}
.abt{text-align:center;font:800 italic 19px/1 var(--display);opacity:0;transform:translateY(6px);transition:.22s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrolled .abt{opacity:1;transform:none}
.abr{display:flex;gap:6px;align-items:center}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font:700 12px/1 var(--body);letter-spacing:.5px}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--bar-ink);color:#0e131c}

/* ---------- screens ---------- */
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.scr{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 12px;display:grid;gap:18px}
.scr>*{min-width:0}
.in{animation:in .32s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.lt{padding-top:6px}
.lt h1{font-size:38px;letter-spacing:.2px}
.lt p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eb{font:700 11px/1 var(--body);letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.sh2{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px;margin:2px 4px 10px}
.sh2 h2{font-size:24px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.note{padding:12px 14px;border-radius:14px;background:var(--surface2);color:var(--muted);font-size:13.5px;margin:0}
.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}

/* ---------- hero scene ---------- */
.hero{position:relative;overflow:hidden;background:var(--sc-sky1);margin-top:-12px}
.hero svg.scene{width:100%;height:auto}
.hero .ov{position:relative;padding:14px max(16px,env(safe-area-inset-left,0px)) 16px;background:#0e131c;color:#fff}
.hero .ov::before{content:"";position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(to top,#0e131c,transparent)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font:800 italic 14px/1 var(--display);letter-spacing:.6px;background:var(--lead);color:var(--lead-ink);padding:5px 8px 4px;border-radius:7px;text-transform:uppercase}
.hero h1{font-size:32px;margin-top:8px}
.ar{color:var(--lead);padding:0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--body);padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips.dk .chip{background:var(--surface2);color:var(--ink2)}

/* ---------- tiles ---------- */
.dayw{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%}
.dayw svg.j{width:58px;height:58px;flex:none}
.dayw .t{flex:1;min-width:0}
.dayw b{display:block;font:800 italic 22px/1.05 var(--display)}
.dayw .tm{font:600 15px/1 var(--mono);text-align:right}
.dayw .tm small{display:block;font:600 10px/1.4 var(--body);letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.jt{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border-radius:20px;padding:14px 10px 14px 16px;color:#fff;position:relative;overflow:hidden;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;box-shadow:var(--shadow)}
.jt .jb{min-width:0;display:flex;flex-direction:column;gap:3px}
.jt.gen{background:linear-gradient(160deg,var(--lead),var(--lead2));color:var(--lead-ink)}
.jt.verde{background:linear-gradient(160deg,#16b065,#087a42)}
.jt.pois{background:#fdfdfd;color:#141414;background-image:radial-gradient(circle,#e3241b 0 6px,transparent 6.5px);background-size:26px 26px;background-position:4px 4px}
.jt.pois .jb{background:rgba(255,255,255,.92);border-radius:12px;padding:6px 8px;margin:-4px -4px 0}
.jt svg.j{width:76px;height:76px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28))}
.jt .l{font:700 10px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.jt b{font:800 italic 26px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jt .v{font:600 12px/1.3 var(--mono);opacity:.9}

/* podium */
.podw{position:relative;padding:18px 12px 0;background:radial-gradient(120% 90% at 50% 100%,var(--lead-soft),transparent 70%)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;position:relative}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.pod svg.j{width:64px;height:64px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22))}
.pod:nth-child(2) svg.j{width:82px;height:82px}
.pod .n{font:800 italic 19px/1 var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .g{font:600 11px/1 var(--mono);color:var(--muted);margin-bottom:12px}
.blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:8px;position:relative;
  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.blk::before{content:"";position:absolute;left:-6px;right:-6px;top:-7px;height:8px;border-radius:6px 6px 0 0;background:var(--c1);filter:brightness(1.12)}
.blk span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#141414;font:900 italic 21px/1 var(--display);box-shadow:0 3px 8px rgba(0,0,0,.2);position:relative}
.pod:nth-child(1) .blk{height:66px;--c1:#c9d1dc;--c2:#97a3b3}
.pod:nth-child(2) .blk{height:96px;--c1:#ffd75a;--c2:#e2a800}
.pod:nth-child(3) .blk{height:50px;--c1:#e3a06a;--c2:#b06a35}
.conf{position:absolute;inset:0;pointer-events:none;opacity:.8}
.podium{z-index:1}

/* route map */
.route{padding:12px 6px 6px}
.route svg{width:100%;height:auto}
.rleg{display:flex;flex-wrap:wrap;gap:10px;padding:2px 14px 12px;font:600 11px/1 var(--body);color:var(--muted)}
.rleg span{display:inline-flex;align-items:center;gap:5px}
.rleg i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* next stage */
.nx{display:grid;grid-template-columns:120px 1fr;gap:0;align-items:stretch;text-align:left;width:100%}
.nx svg{width:100%;height:100%;object-fit:cover}
.nx .t{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.nx b{font:800 italic 21px/1.05 var(--display)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 italic 16px/1 var(--display);letter-spacing:.5px;text-transform:uppercase;padding:13px 18px;border-radius:14px;background:var(--lead);color:var(--lead-ink);box-shadow:0 8px 18px -10px var(--lead)}
.cta:disabled{opacity:.5}
.cta.sec{background:var(--surface2);color:var(--ink);box-shadow:none}

/* countdown */
.cdw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.cdw div{background:var(--surface2);border-radius:14px;padding:12px 6px;text-align:center}
.cdw b{display:block;font:900 italic 38px/1 var(--display)}
.cdw small{font:700 10px/1 var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.mix{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px}
.mix div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mix svg{width:100%;height:34px}
.mix b{font:900 italic 26px/1 var(--display)}
.mix small{font-size:11px;color:var(--muted);line-height:1.15}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface3);border-radius:12px;padding:3px;gap:3px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:9px;font:700 13px/1 var(--body);color:var(--muted)}
.seg button svg.j{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* leader banner */
.lb{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);overflow:hidden;color:var(--lead-ink);background:linear-gradient(135deg,var(--lead),var(--lead2))}
.lb.verde{background:linear-gradient(135deg,#16b065,#087a42);color:#fff}
.lb.pois{background:#fdfdfd;color:#141414;background-image:radial-gradient(circle,#e3241b 0 7px,transparent 7.5px);background-size:30px 30px}
.lb.pois .t{background:rgba(255,255,255,.93);border-radius:12px;padding:8px 10px}
.lb svg.j{width:96px;height:96px;flex:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.lb .t{min-width:0}
.lb h3{font-size:34px}
.lb .v{font:600 15px/1.2 var(--mono);margin-top:4px}
.lb .l{font:700 10px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;opacity:.85}

/* grouped list */
.gl{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gl li{position:relative}
.gl .row{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto 10px;align-items:center;gap:10px;padding:10px 12px 10px 14px;width:100%;text-align:left}
.gl li+li .row::before{content:"";position:absolute;top:0;left:92px;right:0;height:1px;background:var(--line)}
.gl .row:active{background:var(--surface2)}
.gl .pos{font:900 italic 24px/1 var(--display);text-align:center}
.gl svg.j{width:40px;height:40px}
.gl .nm b{display:block;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .bar{height:4px;border-radius:4px;background:var(--surface3);margin-top:6px;overflow:hidden}
.gl .bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--lead))}
.gl .r{text-align:right;font:600 13.5px/1.25 var(--mono)}
.gl .r small{display:block;font:500 11px/1.2 var(--mono);color:var(--muted)}
.chev{width:8px;height:14px;color:var(--muted);opacity:.6}
.mv{font:800 10.5px/1 var(--body);display:inline-flex;align-items:center;gap:1px;padding:2px 4px;border-radius:5px;margin-left:4px;vertical-align:1px}
.mv.up{color:var(--green);background:rgba(11,155,86,.12)}.mv.dn{color:var(--kom);background:rgba(227,36,27,.1)}.mv.eq{color:var(--muted);background:var(--surface2)}
.gl .ln{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.rd{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.rd svg{width:16px;height:16px}
.tg{font:700 10px/1 var(--body);padding:3px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tg.g{background:rgba(11,155,86,.13);color:var(--green)}.tg.k{background:rgba(227,36,27,.11);color:var(--kom)}.tg.b{background:var(--lead-soft);color:var(--ink)}.tg.x{background:rgba(227,36,27,.11);color:var(--kom)}

/* charts */
.chart{padding:14px 8px 10px}
.chart .hd{padding:0 8px 8px}
.chart .wrap{overflow-x:auto;scrollbar-width:thin}
.chart .wrap>svg{min-width:540px;width:100%;height:auto}
.legend{display:flex;gap:6px;overflow-x:auto;padding:2px 8px 10px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend button{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px 5px 5px;border-radius:999px;background:var(--surface2)}
.legend button svg.j{width:20px;height:20px}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* stage chips */
.sc{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.sc button{flex:none;width:66px;scroll-snap-align:center;border-radius:16px;padding:8px 6px 7px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.sc button b{font:900 italic 22px/1 var(--display)}
.sc button small{font:600 10px/1 var(--body);color:var(--muted)}
.sc button svg{width:52px;height:18px}
.sc button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sc button[aria-pressed="true"] small{color:inherit;opacity:.7}
.sc .st{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.sc .st.fut{background:var(--surface3)}.sc .st.neu{background:var(--amber)}
.sc .ck{position:absolute;top:4px;left:6px;font:900 11px/1 var(--body);color:var(--green)}
.alt{padding:12px 6px 6px}
.alt .hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 10px 4px}
.alt svg{width:100%;height:auto}
.gleg{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 10px;font:600 11px/1 var(--mono);color:var(--muted)}
.gleg span{display:inline-flex;align-items:center;gap:4px}
.gleg i{width:14px;height:8px;border-radius:2px;display:inline-block}

/* team cards */
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tc{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.tc .top{position:relative;height:118px;background:linear-gradient(160deg,var(--k1),var(--k2));display:grid;place-items:center;overflow:hidden}
.tc .top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 10px,transparent 10px 22px)}
.tc .top svg.j{width:98px;height:98px;position:relative;z-index:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));margin-top:10px}
.tc .rk{position:absolute;top:8px;left:8px;z-index:2;min-width:34px;height:34px;padding:0 6px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#141414;font:900 italic 21px/1 var(--display)}
.tc .rk.l{background:var(--lead);color:var(--lead-ink)}
.tc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tc b{font:800 italic 20px/1.05 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .ic{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

function compute(R){

  const last=st.lastIndexOf("ok")>=st.lastIndexOf("neu")?st.lastIndexOf("ok"):st.lastIndexOf("neu");
  const cum={gen:[],verde:[],pois:[]}, rank={gen:[],verde:[],pois:[]};
  const run={};names.forEach(n=>run[n]={t:0,g:0,p:0});
  const day=[];
  R.stages.forEach((s,i)=>{
    const r=res[i]||{};const rows=[];
    names.forEach(n=>{const v=r[n];if(!v)return;const tot=v[1]-v[2]+v[3];run[n].t+=tot;run[n].g+=v[4];run[n].p+=v[5];rows.push({n,rd:v[0],t:v[1],b:v[2],pe:v[3],tot,g:v[4],k:v[5],f:v[6]||""})});
    if(st[i]==="ok"){rows.sort((a,b)=>a.tot-b.tot);rows.forEach((x,j)=>x.gap=x.tot-rows[0].tot)}
    day.push(rows);
    const snap=n=>({...run[n]});
    cum.gen.push(Object.fromEntries(names.map(n=>[n,snap(n)])));
    if(st[i]!=="fut"){
      rank.gen[i]=ranker(names,n=>run[n].t,1);rank.verde[i]=ranker(names,n=>run[n].g,-1);rank.pois[i]=ranker(names,n=>run[n].p,-1);
    }
  });
  const totals=last>=0?cum.gen[last]:Object.fromEntries(names.map(n=>[n,{t:0,g:0,p:0}]));
  // stage wins per DT
  const wins={};names.forEach(n=>wins[n]=0);
  day.forEach((rows,i)=>{if(st[i]!=="ok")return;rows.filter(x=>x.gap===0).forEach(x=>wins[x.n]++)});
  return {st,last,day,cum,rank,totals,wins};
}

    centers.forEach(c=>{y+=c.h*Math.exp(-((x-c.x)**2)/(2*c.w*c.w))});pts.push([x,Math.max(.02,y)])}

}
const slopeCol=g=>g<3?"var(--g1)":g<6?"var(--g2)":g<9?"var(--g3)":g<12?"var(--g4)":"var(--g5)";

function bumpPath(pts){let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],m=(a[0]+b[0])/2;d+=` C${m.toFixed(1)} ${a[1].toFixed(1)} ${m.toFixed(1)} ${b[1].toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`}return d}
function smooth(pts){if(pts.length<3)return "M"+pts.map(p=>p.join(" ")).join(" L");let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

function miniProf(s){const {pts}=profilePts(s,40);const w=52,h=18;const d="M"+pts.map(p=>(p[0]*w).toFixed(1)+" "+(h-1-p[1]*(h-3)).toFixed(1)).join(" L");

/* ---------- cyclist ---------- */
function ik(H,P,a,b){const dx=P[0]-H[0],dy=P[1]-H[1];let d=Math.hypot(dx,dy);d=Math.min(d,a+b-.01);const th=Math.atan2(dy,dx);const al=Math.acos((a*a+d*d-b*b)/(2*a*d));

function wheel(cx,cy,r){let sp="";for(let i=0;i<8;i++){const a=i*Math.PI/8;sp+=`M${(cx-Math.cos(a)*r*.86).toFixed(1)} ${(cy-Math.sin(a)*r*.86).toFixed(1)}L${(cx+Math.cos(a)*r*.86).toFixed(1)} ${(cy+Math.sin(a)*r*.86).toFixed(1)}`}
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#11151c" stroke-width="3.6"/><circle cx="${cx}" cy="${cy}" r="${r-3.2}" fill="none" stroke="#9aa3b0" stroke-width="1.1"/>
  <g class="wh"><path d="${sp}" stroke="#c4cad3" stroke-width=".6"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="transparent"/></g><circle cx="${cx}" cy="${cy}" r="2" fill="#11151c"/>`}

  <path d="M-16 -27Q-9 -33 -4 -33" fill="none" stroke="#12161d" stroke-width="10" stroke-linecap="round"/>
  <path d="M15 -41L20 -31L27 -23" fill="none" stroke="${k.b}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 -32L27 -23" stroke="#a87556" stroke-width="3.6" stroke-linecap="round"/>

    if(s.ty==="mountain")pk.forEach((p,i)=>{if(i%2===0&&p[1]<h*.32){const q=pk[i+1]||p,o=pk[i-1]||p;far+=`<path d="M${p[0]} ${p[1]}L${(p[0]+(q[0]-p[0])*.32).toFixed(1)} ${(p[1]+(q[1]-p[1])*.32).toFixed(1)}l-5 4l-5 -3L${(p[0]+(o[0]-p[0])*.3).toFixed(1)} ${(p[1]+(o[1]-p[1])*.3).toFixed(1)}Z" fill="var(--sc-snow)" opacity=".9"/>`}});

    deco=[.07,.15,.24].map((f,i)=>{const tx=w*f,ty=h*(.44-.02*i);return `<g transform="translate(${tx} ${ty})" opacity=".8"><path d="M0 0V-34" stroke="#f3f5f8" stroke-width="2"/><g class="wh" style="animation-duration:${3+i}s"><path d="M0 -34l0 -14M0 -34l12 7M0 -34l-12 7" stroke="#f3f5f8" stroke-width="2" stroke-linecap="round"/></g></g>`}).join("");

  }

  if(s.ty==="hilly"||s.ty==="medium"){for(let i=0;i<14;i++){const tx=r()*w,ty=h*(.55+r()*.08),ts=4+r()*5;deco+=`<path d="M${tx.toFixed(1)} ${(ty-ts*2.4).toFixed(1)}l${ts} ${ts*2.4}h${-ts*2}Z" fill="var(--sc-land2)" opacity=".9"/>`}
    for(let i=0;i<3;i++){const fy=h*(.6+i*.025);deco+=`<path d="M${w*(.05+i*.3)} ${fy}h${w*.18}" stroke="var(--sc-land1)" stroke-width="2" opacity=".6"/>`}}
  const sun=`<circle cx="${w*.8}" cy="${h*.2}" r="${thumb?14:24}" fill="var(--sc-sun)"/><circle cx="${w*.8}" cy="${h*.2}" r="${thumb?22:40}" fill="var(--sc-sun)" opacity=".25"/>`;
  const cloud=(cx,cy,sz)=>`<g class="cl" opacity=".85"><ellipse cx="${cx}" cy="${cy}" rx="${sz*1.6}" ry="${sz*.55}" fill="var(--sc-cloud)"/><ellipse cx="${cx-sz*.5}" cy="${cy-sz*.35}" rx="${sz*.7}" ry="${sz*.55}" fill="var(--sc-cloud)"/><ellipse cx="${cx+sz*.4}" cy="${cy-sz*.45}" rx="${sz*.8}" ry="${sz*.7}" fill="var(--sc-cloud)"/></g>`;

/* ---------- altimetry chart ---------- */
function peaks(el,minGain){const N=el.length-1,out=[];for(let i=1;i<=N;i++){const w=4;let isMax=true;for(let k=Math.max(0,i-w);k<=Math.min(N,i+w);k++)if(el[k]>el[i])isMax=false;if(!isMax)continue;
  let lo=el[i];for(let k=i;k>=0;k--){lo=Math.min(lo,el[k]);if(el[k]>el[i])break}const gain=el[i]-lo;if(gain>=minGain&&!out.some(o=>Math.abs(o.i-i)<8))out.push({i,gain})}return out}
function altimetry(s,w=360,h=180){
  const id="a"+(UID++);const {pts,centers,elev,N}=profilePts(s,80);const L=34,Rr=10,T=26,B=24;
  const emax=Math.ceil(Math.max(...elev)/250)*250||250;
  const X=x=>L+x*(w-L-Rr),Y=e=>h-B-(e/emax)*(h-T-B);
  const seg=s.km*1000/N;let sl="";
  for(let i=0;i<N;i++){const g=(elev[i+1]-elev[i])/seg*100;const x0=X(i/N),x1=X((i+1)/N);
    sl+=`<path d="M${x0.toFixed(1)} ${Y(elev[i]).toFixed(1)}L${x1.toFixed(1)} ${Y(elev[i+1]).toFixed(1)}L${x1.toFixed(1)} ${h-B}L${x0.toFixed(1)} ${h-B}Z" fill="${slopeCol(g)}"/>`}
  const ridge="M"+elev.map((e,i)=>X(i/N).toFixed(1)+" "+Y(e).toFixed(1)).join("L");
  let grid="";for(let e=0;e<=emax;e+=emax/4){grid+=`<line x1="${L}" x2="${w-Rr}" y1="${Y(e)}" y2="${Y(e)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(e)+3}" text-anchor="end" font-size="9" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${e}</text>`}
  const ticks=[0,.25,.5,.75,1].map(f=>`<text x="${X(f)}" y="${h-8}" font-size="9" font-family="IBM Plex Mono,monospace" fill="var(--muted)" text-anchor="${f===0?"start":f===1?"end":"middle"}">${Math.round(s.km*f)}${f===1?" km":""}</text>`).join("");
  const cat=gain=>gain>1500?"HC":gain>900?"1":gain>550?"2":gain>280?"3":"4";
  const koms=peaks(elev,150).map(({i,gain})=>{const e=elev[i];const fin=i>=N-1;const x=X(i/N)+(fin?-16:0),y=Y(e)-12+(fin?4:0);const lb=cat(gain);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="${lb==="HC"?-9:-7}" y="-8" width="${lb==="HC"?18:14}" height="13" rx="3" fill="#e3241b"/><text y="2" text-anchor="middle" font-size="9" font-weight="800" font-family="Archivo,sans-serif" fill="#fff">${lb}</text><path d="M0 5V9" stroke="#e3241b"/></g>`}).join("");
  const spr=(s.ty!=="itt"&&s.ty!=="mountain")?(()=>{const i=Math.round(.58*N);return `<g transform="translate(${X(i/N).toFixed(1)} ${(Y(elev[i])-12).toFixed(1)})"><circle r="7" fill="#0d9e57"/><text y="3" text-anchor="middle" font-size="9" font-weight="800" font-family="Archivo,sans-serif" fill="#fff">S</text></g>`})():"";
  const fe=Y(elev[N]);
  const fin=`<g transform="translate(${X(1)} ${fe})"><path d="M0 0V-20" stroke="var(--ink)" stroke-width="1.4"/>${[0,1,2].map(r=>[0,1,2,3].map(c=>`<rect x="${c*3}" y="${-20+r*3}" width="3" height="3" fill="${(r+c)%2?"var(--surface)":"var(--ink)"}"/>`).join("")).join("")}</g>`;
  const clock=s.ty==="itt"?`<g transform="translate(${L+14} ${T+4})"><circle r="9" fill="var(--surface)" stroke="var(--blue)" stroke-width="2"/><path d="M0 -5V0L4 2" stroke="var(--blue)" stroke-width="2" fill="none" stroke-linecap="round"/></g>`:"";
  const lbl=(x,anchor,txt)=>`<text x="${x}" y="13" text-anchor="${anchor}" font-size="10.5" font-weight="700" font-family="Archivo,sans-serif" fill="var(--ink2)">${esc(txt)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("altT")} ${esc(s.a)} – ${esc(s.b)}"><defs><linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient></defs>
  ${grid}${sl}<path d="${ridge}L${X(1)} ${h-B}L${X(0)} ${h-B}Z" fill="url(#${id}f)"/><path d="${ridge}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="${L-5}" y="${T-12}" text-anchor="end" font-size="8.5" font-family="IBM Plex Mono,monospace" fill="var(--muted)">m</text>
  ${lbl(L,"start",s.a)}${s.a!==s.b?lbl(w-Rr,"end",s.b):""}${koms}${spr}${fin}${clock}${ticks}</svg>`;
}

let DB=null,ME=null,PK={},DBS="loading",CANW=true,PSEL=null,BUSY=false,MSG=null;

  if(C.st[SEL]==="fut")body=futBody(R,SEL);
  else{const ok=C.st[SEL]==="ok";const sorted=ok?rows:[...rows].sort((a,b)=>(b.g+b.k)-(a.g+a.k));
    body=(C.st[SEL]==="neu"?`<p class="note">${t("neutral")}</p>`:"")+`<div class="sh2" style="margin-bottom:-6px"><h2>${t("results")}</h2></div><ul class="gl">${sorted.map(x=>`<li><button class="row press" data-dt="${esc(x.n)}" style="grid-template-columns:28px 40px minmax(0,1fr) auto 10px"><span class="pos">${ok?sorted.findIndex(y=>y.tot===x.tot)+1:"·"}</span>${jersey(x.n)}<span class="nm"><b>${esc(x.n)}</b><span class="ln"><span class="rd">${esc(x.rd)}</span>${x.b?`<span class="tg b">−${x.b}"</span>`:""}${x.pe?`<span class="tg">+${x.pe}"</span>`:""}${x.g?`<span class="tg g">${x.g} P</span>`:""}${x.k?`<span class="tg k">${x.k} M</span>`:""}${x.f?`<span class="tg x">${x.f==="SE"?t("noChoice"):t("retired")}</span>`:""}</span></span><span class="r">${ok?(x.gap===0?hms(x.tot):gapT(x.gap)):"—"}${ok&&x.gap>0?`<small>${hms(x.tot)}</small>`:""}</span>${chev}</button></li>`).join("")}</ul>`}
  if(ADMIN&&C.st[SEL]!=="fut"&&RESDB[R.id+"_"+s.n]&&!(R.res[SEL]&&Object.keys(R.res[SEL]).length))body+=`<details class="card"><summary class="lnk" style="padding:14px;display:block">${t("editRes")}</summary>${resForm(R,SEL)}</details>`;
  return `${largeTitle(t("stg"),t("sub_stg").replace("{km}",R.km))}${stageChips(R,C,SEL,"s")}
  <section class="hero bleed" style="margin-top:0">${scene(s,{riders:C.st[SEL]==="fut"?[jkind("gen")]:(C.day[SEL]||[]).slice(0,3).map(x=>x.n)})}<div class="ov"><span class="tag">${t("stageOf").replace("{n}",s.n)}</span><h1>${stageTitle(s)}</h1>${chips(s)}</div></section>
  <section class="card alt"><div class="hd"><h2 style="font-size:21px">${t("altT")}</h2><span class="eb">${String(s.km).replace(".",",")} km</span></div>${altimetry(s)}${gradLegend()}</section>
  ${body}`;
}
function futBody(R,i){
  const open=isOpen(R,i),me=myDt();
  if(open){const n=DTS.filter(d=>dbPick(R,d.n,i)).length;const mine=me&&dbPick(R,me,i);
    return `<section class="card stat2"><div class="t"><div class="eb">${t("closesIn")} · ${countdown(lockAt(R.stages[i]))}</div><b>${n}/10 ${t("chose")}</b>${me?`<div class="muted" style="font-size:13px;margin-top:3px">${t("yourPick")}: <strong style="color:var(--ink)">${mine?esc(mine):"—"}</strong></div>`:""}<div class="pbar"><i style="width:${n*10}%"></i></div></div><button class="cta press" data-gopick="${i}">${t("pick")}</button></section><p class="note">${t("lockNote")}</p>`}
  const any=DTS.some(d=>dbPick(R,d.n,i));
  if(!any)return `<p class="note">${t("future")}</p>`;
  const form=ADMIN?`<section class="card">${resForm(R,i)}</section>`:"";
  return `<div class="sh2" style="margin-bottom:-6px"><h2>${t("revealed")}</h2></div><ul class="gl">${DTS.map(d=>{const p=dbPick(R,d.n,i);return `<li><button class="row press" data-dt="${esc(d.n)}" style="grid-template-columns:40px minmax(0,1fr) auto 10px">${jersey(d.n)}<span class="nm"><b>${esc(d.n)}</b><small>${p?esc(p):t("none")}</small></span><span></span>${chev}</button></li>`}).join("")}</ul>${form}`;
}

/* ---------- PICK ---------- */
function vPick(R,C){
  const head=largeTitle(t("pick"),t("sub_pick"));
  if(DBS==="loading")return head+`<p class="note">${t("loading")}</p>`;
  if(DBS==="off")return head+`<p class="note">${t("signin")}</p>`;
  const me=myDt();
  if(!me)return largeTitle(t("who"),t("whoSub"))+(MSG?`<div class="msg ${MSG[0]}">${MSG[1]}</div>`:"")+`<div class="teams">${DTS.map(d=>{const o=ownerOf(d.n);const tk=o&&o!==ME;
    return `<button class="tc press" data-claim="${esc(d.n)}" ${tk||!CANW?"disabled":""} style="--k1:${KIT[d.n][0]};--k2:${shade(KIT[d.n][0])}"><div class="top">${jersey(d.n)}</div><div class="bd"><b>${esc(d.n)}</b><small>${esc(d.t)}</small>${tk?`<span class="wx">${t("taken")}</span>`:""}</div></button>`}).join("")}</div>`;
  const open=R.stages.map((s,i)=>i).filter(i=>isOpen(R,i));
  const meCard=`<div class="card me">${jersey(me)}<div class="t"><div class="eb">${t("ds")}</div><b>${esc(me)}</b><small class="muted">${esc(DTS.find(d=>d.n===me).t)}</small></div><button class="lnk" data-unclaim="1">${t("change")}</button></div>`;
  if(!CANW)return head+meCard+`<p class="note">${t("readonly")}</p>`;
  if(!open.length)return head+meCard+`<p class="note">${t("noOpen")}</p>`;
  if(PSEL==null||!open.includes(PSEL))PSEL=open[0];
  const s=R.stages[PSEL],cur=dbPick(R,me,PSEL),used=usedList(R,me,-1),dd=dups(R,me);
  return `${head}${meCard}${stageChips(R,C,PSEL,"ps",i=>open.includes(i))}
  <section class="card"><div class="hero" style="margin:0">${scene(s,{h:180,riders:[me]})}<div class="ov"><span class="tag">${t("stage")} ${s.n}</span> <span class="chip" style="margin-left:4px">${t("closesIn")} · ${countdown(lockAt(s))}</span><h1 style="font-size:28px">${stageTitle(s)}</h1></div></div>
   <form class="pf" id="pf" autocomplete="off">
    ${cur?`<div class="cur">${jersey(me,{noshadow:1})}<div><div class="eb">${t("nowPick")}</div><b>${esc(cur)}</b></div></div>`:""}
    <label for="rin">${t("yourPick")}</label>
    <div class="fld"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="rin" name="rin" list="riders" placeholder="${t("ph")}" value="${cur?esc(cur):""}" enterkeyhint="done"></div>
    ${MSG&&MSG[2]!=="res"?`<div class="msg ${MSG[0]}">${MSG[1]}</div>`:""}
    <button class="cta press" type="submit" ${BUSY?"disabled":""}>${t("save")}</button>
    ${cur?`<button type="button" class="lnk" style="justify-self:center" data-clear="1">${t("clear")}</button>`:""}
   </form></section>
  ${dd.map(x=>`<div class="msg err">${t("dupT")}: ${esc(x.rd)} (${x.st.map(k=>"T"+k).join(", ")})</div>`).join("")}
  <p class="note">${t("lockNote")}</p>
  <section><div class="sh2"><h2 style="font-size:20px">${t("used")}</h2><span class="eb">${used.length}/21</span></div>${used.length?`<div class="used">${used.map(u=>`<span><small>T${u.n}</small>${esc(u.rd)}</span>`).join("")}</div>`:`<p class="note">${t("noPicksYet")}</p>`}</section>`;
}

/* ---------- TEAMS ---------- */
function shade(hex,f=-.38){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return "#"+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function vTeams(R,C){
  const sd=standing(C,"gen");const ord=C.last>=0?sd.map(x=>x.n):DTS.map(d=>d.n);
  return `${largeTitle(t("teams"),t("sub_teams"))}<div class="teams">${ord.map(n=>{const d=DTS.find(x=>x.n===n);const tt=C.totals[n];const p=sd.find(x=>x.n===n);const k=KIT[n];
   return `<button class="tc press" data-dt="${esc(n)}" style="--k1:${k[0]==="#f5f5f4"?"#dfe3ea":k[0]};--k2:${shade(k[0]==="#f5f5f4"?"#9aa6b8":k[0])}"><div class="top">${C.last>=0?`<span class="rk ${p.pos===1?"l":""}">${p.pos}</span>`:""}${jersey(n)}</div>
   <div class="bd"><b>${esc(d.t)}</b><small>${esc(n)}${n===myDt()?" · "+(L==="it"?"tu":"tú"):""}</small><div class="ic"><span style="background:var(--lead-soft)">${C.last>=0?(p.pos===1?gcT(tt.t).split(" ")[0]:gapT(tt.t-sd[0].v)):"—"}</span><span style="color:#0d9e57">${tt.g}P</span><span style="color:#e3241b">${tt.p}M</span></div>${dups(R,n).length?`<span class="wx">${t("dupT")}</span>`:""}</div></button>`}).join("")}</div>`;
}

/* ---------- RULES ---------- */
function vRules(){
  return `${largeTitle(t("rulesT"))}<section class="card rules">
  <div class="rule"><svg viewBox="-50 -60 100 72" aria-hidden="true"><circle cx="0" cy="-20" r="40" fill="var(--lead-soft)"/>${cyclist(jkind("gen"),0,0,.95)}</svg><div><h3>${t("r1h")}</h3><p>${t("r1")}</p></div></div>
  <div class="rule">${jersey(jkind("gen"))}<div><h3>${t("r2h")}</h3><p>${t("r2")}</p></div></div>
  <div class="formula">${L==="it"?"tempo = arrivo − abbuoni + penalità":"tiempo = llegada − bonificaciones + penalizaciones"}<br>${L==="it"?"generale = Σ tempo (tappe 1–21)":"general = Σ tiempo (etapas 1–21)"}</div>
  <div class="rule">${jersey("verde")}<div><h3>${t("r3h")}</h3><p>${t("r3")}</p></div></div>
  <div class="rule">${jersey("pois")}<div><h3>${t("r4h")}</h3><p>${t("r4")}</p></div></div>
  <div class="rule">${jersey("neutral")}<div><h3>${t("r5h")}</h3><p>${t("r5")}</p></div></div></section>
  <p class="muted" style="font-size:12px;margin:0 4px">${t("src")}</p>`;
}

/* ---------- SHEETS ---------- */
function openSheet(html,kv){const sh=$("#sh");sh.innerHTML=`<div class="grab" id="grab"></div><button class="shx press" id="x" aria-label="Chiudi"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button>`+html;
  sh.style.removeProperty("--dy");if(kv)Object.entries(kv).forEach(([k,v])=>sh.style.setProperty(k,v));sh.scrollTop=0;
  $("#scrim").classList.add("on");sh.classList.add("on");$("#x").onclick=closeSheet;setTimeout(()=>$("#x").focus({preventScroll:true}),50);vib()}
function closeSheet(){$("#scrim").classList.remove("on");$("#sh").classList.remove("on")}
function openDT(n){
  const R=RACES[RID],C=compute(R);const d=DTS.find(x=>x.n===n);const tt=C.totals[n];const k=KIT[n];
  const sd=standing(C,"gen"),p=sd.find(x=>x.n===n),pv=standing(C,"verde").find(x=>x.n===n),pp=standing(C,"pois").find(x=>x.n===n);
  let best=-1,bp=99;C.day.forEach((rows,i)=>{if(C.st[i]!=="ok")return;const kk=rows.findIndex(x=>x.n===n);if(kk<0)return;const pos=rows.findIndex(y=>y.tot===rows[kk].tot)+1;if(pos<bp){bp=pos;best=i}});
  const has=C.last>=0;
  const spark=has?(()=>{const idx=[];C.rank.gen.forEach((r,i)=>{if(r)idx.push(i)});const w=320,h=70;const X=j=>8+j*(w-16)/Math.max(1,idx.length-1),Y=q=>8+(q-1)*(h-16)/9;const pts=idx.map((i,j)=>[X(j),Y(C.rank.gen[i][n])]);const c=kitColor(n);const e=pts[pts.length-1];
    return `<section class="card" style="padding:12px 12px 8px"><div class="eb" style="margin:0 4px 6px">${t("posG")}</div><svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${[1,5,10].map(q=>`<line x1="8" x2="${w-8}" y1="${Y(q)}" y2="${Y(q)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("")}<path d="${bumpPath(pts)} L${e[0]} ${h} L8 ${h}Z" fill="${c}" opacity=".12"/><path d="${bumpPath(pts)}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="4.5" fill="var(--surface)" stroke="${c}" stroke-width="2.4"/></svg></section>`})():"";
  const tl=R.stages.map((s,i)=>{let r=(C.day[i]||[]).find(x=>x.n===n);const pos=r&&C.st[i]==="ok"?C.day[i].findIndex(y=>y.tot===r.tot)+1:null;
    if(!r){const pk=dbPick(R,n,i);if(pk)r={rd:isOpen(R,i)&&n!==myDt()?t("hidden"):pk,g:0,k:0}}
    return `<li class="${i===best?"best":""}"><span class="sn">T${s.n}</span><span class="dot" style="background:${tyCol(s.ty)}"></span><b>${r?esc(r.rd):"—"}</b><span class="p">${[pos?pos+"°":"",r&&r.g?r.g+"P":"",r&&r.k?r.k+"M":""].filter(Boolean).join(" · ")}</span></li>`}).join("");
  openSheet(`<div class="shh">${jersey(n)}<div class="t"><div class="eb">${t("ds")} · ${esc(n)}</div><h2>${esc(d.t)}</h2><div class="mono" style="font-size:13px;margin-top:4px;opacity:.9">${has?gcT(tt.t):""}</div></div></div>
  <div class="shb"><div class="rings">${ring(has?p.pos:0,10,"gen",has?(p.pos===1?t("leader"):gapT(tt.t-sd[0].v)):t(jkind("gen")))}${ring(has?pv.pos:0,10,"verde",tt.g+" "+t("points"))}${ring(has?pp.pos:0,10,"pois",tt.p+" "+t("points"))}</div>
  ${has?`<p class="note">${C.wins[n]} ${t("stageWin")}${best>=0?` · ${t("best")}: ${t("stage")} ${best+1} (${bp}°)`:""}</p>`:""}
  ${dups(R,n).map(x=>`<div class="msg err">${t("dupT")}: ${esc(x.rd)} (${x.st.map(q=>"T"+q).join(", ")})</div>`).join("")}
  ${spark}<div class="eb" style="margin:0 4px">${t("picks")}</div><ul class="tl">${tl}</ul></div>`,{"--k1":k[0]==="#f5f5f4"?"#c9d0da":k[0],"--k2":shade(k[0]==="#f5f5f4"?"#7f8a9b":k[0])});
}
function raceSheet(){openSheet(`<div style="padding:4px 16px 0"><h2 style="font-size:26px;margin:4px 0 12px">${t("races")}</h2><div class="card">${Object.values(RACES).map(r=>`<button class="opt press" data-race="${r.id}">${jersey(r.lead)}<span><b>${esc(r.name)}</b><small>${r.sub} · ${r.km} km</small></span>${RID===r.id?'<span class="ck">✓</span>':""}</button>`).join("")}</div></div>`)}
function langSheet(){openSheet(`<div style="padding:4px 16px 0"><h2 style="font-size:26px;margin:4px 0 12px">${t("langT")}</h2><div class="lang">${[["it","Italiano"],["es","Español"]].map(([k,v])=>`<button data-l="${k}" aria-pressed="${L===k}">${v}</button>`).join("")}</div></div>`)}
/* drag to close */
(()=>{let y0=null,dy=0;const sh=()=>$("#sh");
  document.addEventListener("pointerdown",e=>{if(!e.target.closest("#grab,.shh"))return;y0=e.clientY;dy=0;sh().classList.add("drag")});
  document.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh().style.setProperty("--dy",dy+"px")});
  const end=()=>{if(y0==null)return;sh().classList.remove("drag");if(dy>90)closeSheet();sh().style.removeProperty("--dy");y0=null};
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end)})();

/* ---------- shell ---------- */
const TABS=["home","pick","cls","stg","teams","rules"];
const TITLES={home:null,pick:"pick",cls:"cls",stg:"stg",teams:"teams",rules:"rulesT"};
let LASTTAB=null;
function render(){
  document.documentElement.dataset.race=RID;document.documentElement.lang=L;
  const R=RACES[RID],C=compute(R);
  $("#rc").innerHTML=`${jersey(R.lead,{noshadow:1})}<b>${esc(R.short)}</b><i>▼</i>`;
  $("#lb").textContent=L.toUpperCase();
  $("#qb").setAttribute("aria-pressed",TAB==="rules");
  $("#abt").textContent=TITLES[TAB]?t(TITLES[TAB]):"FantaBike";
  $("#riders").innerHTML=riderNames().map(n=>`<option value="${esc(n)}">`).join("");
  const inp=document.getElementById("rin"),keep=inp?{v:inp.value,f:document.activeElement===inp,st:PSEL,r:RID}:null;
  const open=R.stages.some((s,i)=>isOpen(R,i)&&myDt()&&!dbPick(R,myDt(),i));
  $("#tb").innerHTML=TABS.filter(k=>k!=="rules").map(k=>`<button class="press" data-tab="${k}" ${TAB===k?'aria-current="page"':""}><span class="pl"><svg viewBox="0 0 24 24" aria-hidden="true">${icon(k)}</svg></span>${t(k)}${k==="pick"&&open?'<span class="bd">!</span>':""}</button>`).join("");
  const m=$("#m");const anim=LASTTAB!==TAB;LASTTAB=TAB;
  m.innerHTML=`<div class="scr ${anim?"in":""}">${{home:vHome,pick:vPick,cls:vCls,stg:vStg,teams:vTeams,rules:vRules}[TAB](R,C)}</div>`;
  const ni=document.getElementById("rin");if(ni&&keep&&keep.st===PSEL&&keep.r===RID){ni.value=keep.v;if(keep.f)ni.focus()}
  const b=document.querySelector('#strip [aria-pressed="true"]');if(b)b.scrollIntoView({inline:"center",block:"nearest"});
  onScroll();
}
function go(tab){TAB=tab;if(location.hash!=="#"+tab)history.replaceState(null,"","#"+tab);window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-l],[data-race],[data-tab],[data-j],[data-s],[data-dt],[data-hl],[data-go],[data-claim],[data-unclaim],[data-ps],[data-clear],[data-gopick],[data-sheet]");
  if(!b||b===document.documentElement)return;vib();
  if(b.dataset.sheet){b.dataset.sheet==="race"?raceSheet():langSheet();return}
  if(b.dataset.claim){if(!b.disabled)claim(b.dataset.claim);return}
  if(b.dataset.unclaim){MSG=null;writeMine({dt:null},false).then(()=>render());return}
  if(b.dataset.clear){clearPick();return}
  if(b.dataset.ps){PSEL=+b.dataset.ps;MSG=null;render();return}
  if(b.dataset.gopick){PSEL=+b.dataset.gopick;MSG=null;go("pick");render();return}
  MSG=null;
  if(b.dataset.l){L=b.dataset.l;ls.set("fb-l",L);closeSheet()}
  else if(b.dataset.race){RID=b.dataset.race;ls.set("fb-r",RID);SEL=null;HL=null;PSEL=null;closeSheet();LASTTAB=null;window.scrollTo(0,0)}
  else if(b.dataset.s&&b.dataset.tab){SEL=+b.dataset.s;go(b.dataset.tab)}
  else if(b.dataset.tab){go(b.dataset.tab)}
  else if(b.dataset.go){if(b.dataset.j)CJ=b.dataset.j;go(b.dataset.go)}
  else if(b.dataset.j){CJ=b.dataset.j}
  else if(b.dataset.s){SEL=+b.dataset.s}
  else if(b.dataset.hl){HL=HL===b.dataset.hl?null:b.dataset.hl}
  else if(b.dataset.dt){openDT(b.dataset.dt);return}
  render();
});
document.addEventListener("submit",e=>{if(e.target.id==="pf"){e.preventDefault();savePick(e.target.rin.value)}else if(e.target.id==="rf"){e.preventDefault();saveRes(e.target)}});
$("#scrim").onclick=closeSheet;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function onScroll(){$("#ab").classList.toggle("scrolled",window.scrollY>(TAB==="home"?160:50))}
window.addEventListener("scroll",onScroll,{passive:true});
function fromHash(){const h=location.hash.slice(1);if(TABS.includes(h))TAB=h}
window.addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();

async function writeMine(patch,create){
  if(!DB||BUSY)return false;BUSY=true;render();
  try{const ref=DB.collection("picks").doc(ME);if(create||!PK[ME])await ref.set(patch);else await ref.update(patch);BUSY=false;return true}
  catch(e){BUSY=false;MSG=["err",t("saveErr")];render();return false}
}
async function claim(dt){MSG=null;const o=ownerOf(dt);if(o&&o!==ME){MSG=["err",t("takenErr")];render();return}
  const cur=PK[ME]||{};await writeMine({...cur,dt,since:Date.now()},true);render()}
async function savePick(val){
  const R=RACES[RID],me=myDt(),s=R.stages[PSEL];val=String(val||"").replace(/\s+/g," ").trim();
  if(!val){MSG=["err",t("empty")];render();return}
  if(!isOpen(R,PSEL)){render();return}
  const dup=usedList(R,me,PSEL).find(u=>norm(u.rd)===norm(val));
  if(dup){MSG=["err",t("usedErr").replace("{r}",esc(dup.rd)).replace("{n}",dup.n)];render();return}
  const known=riderNames().find(n=>norm(n)===norm(val));if(known)val=known;
  if(await writeMine({[R.id]:{[String(s.n)]:val}},false)){MSG=null;render();toast("✓ "+t("saved")+" · "+esc(val))}
}
async function clearPick(){const R=RACES[RID];if(!isOpen(R,PSEL))return;if(await writeMine({[R.id]:{[String(R.stages[PSEL].n)]:""}},false)){MSG=null;render()}}
(async()=>{
  try{
    if(!window.claude||!window.claude.use){DBS="off";render();return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){DBS="off";render();return}
    ME=await user.id();if(!ME){DBS="off";render();return}
    try{const c=await user.can("data.write");CANW=c!==false}catch(e){}
    DB=db;try{ADMIN=(await user.isOwner())||(await user.canEdit())}catch(e){}
    db.collection("results").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});RESDB=o;render()},()=>{});
    db.collection("picks").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});PK=o;DBS="on";render()},()=>{DBS="off";render()});
  }catch(e){DBS="off";render()}
})();

</script>
