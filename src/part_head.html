<title>FantaBike</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: native-style phone app — translucent dark app bar, iOS-like large titles, edge-to-edge illustrated stage hero,
   inset grouped lists, floating pill tab bar, swipeable bottom sheets. Race colour (red Vuelta / yellow Tour) drives the accent. */
:root{
  --bg:#f1f2f6;--surface:#ffffff;--surface2:#eef0f5;--surface3:#e4e7ee;--ink:#0e131c;--ink2:#2a3240;--muted:#6b7383;--line:rgba(14,19,28,.08);
  --bar:rgba(14,19,28,.84);--bar-ink:#f4f6fa;--bar-mute:#9aa4b4;--tabbar:rgba(255,255,255,.82);
  --green:#0b9b56;--kom:#e3241b;--blue:#2f6fe4;--amber:#f2a900;
  --lead:#d90a1e;--lead2:#a30616;--lead-ink:#ffffff;--lead-soft:rgba(217,10,30,.11);
  --g1:#3fbf6a;--g2:#f4c430;--g3:#f2862e;--g4:#e2412f;--g5:#8e1b2c;
  --sc-sky1:#8cc4ef;--sc-sky2:#eaf4fb;--sc-far:#a9bfd6;--sc-mid:#7fa889;--sc-land1:#5f9a5b;--sc-land2:#3f7442;--sc-snow:#ffffff;--sc-sun:#fff4c4;--sc-sea:#5fa9d6;--sc-cloud:#ffffff;--sc-road:#3a3f48;
  --skin:#cf966f;--shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(14,30,60,.35);
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080b11;--surface:#131923;--surface2:#1b2230;--surface3:#252e3e;--ink:#eef2f8;--ink2:#cfd6e2;--muted:#8a94a6;--line:rgba(255,255,255,.08);
  --bar:rgba(8,11,17,.82);--tabbar:rgba(19,25,35,.84);--lead-soft:rgba(255,70,90,.16);
  --sc-sky1:#152a4a;--sc-sky2:#3b4f72;--sc-far:#2c3e58;--sc-mid:#26443a;--sc-land1:#2c4f33;--sc-land2:#1c3523;--sc-snow:#c9d6e6;--sc-sun:#f3e6b0;--sc-sea:#1d4366;--sc-cloud:#8090a8;--sc-road:#151a22;
  --shadow:0 1px 0 var(--line);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080b11;--surface:#131923;--surface2:#1b2230;--surface3:#252e3e;--ink:#eef2f8;--ink2:#cfd6e2;--muted:#8a94a6;--line:rgba(255,255,255,.08);
  --bar:rgba(8,11,17,.82);--tabbar:rgba(19,25,35,.84);--lead-soft:rgba(255,70,90,.16);
  --sc-sky1:#152a4a;--sc-sky2:#3b4f72;--sc-far:#2c3e58;--sc-mid:#26443a;--sc-land1:#2c4f33;--sc-land2:#1c3523;--sc-snow:#c9d6e6;--sc-sun:#f3e6b0;--sc-sea:#1d4366;--sc-cloud:#8090a8;--sc-road:#151a22;
  --shadow:0 1px 0 var(--line);color-scheme:dark}
:root[data-race="tour"]{--lead:#ffd000;--lead2:#d9ab00;--lead-ink:#141414;--lead-soft:rgba(255,208,0,.2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);overscroll-behavior-y:none}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;margin:0;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0e131c;z-index:40}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.press{transition:transform .14s var(--ease),background-color .14s}
.press:active{transform:scale(.97)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
h1,h2,h3{font-family:var(--display);font-weight:800;font-style:italic;margin:0;line-height:1;text-wrap:balance;letter-spacing:.1px}
.muted{color:var(--muted)}
svg{display:block}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--bar-ink);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--lead) 0 33%,var(--green) 33% 66%,var(--kom) 66%);opacity:.95}
.ab{max-width:600px;margin:0 auto;height:54px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.racechip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(255,255,255,.1)}
.racechip svg.j{width:26px;height:26px}
.racechip b{font:800 italic 17px/1 var(--display);letter-spacing:.2px}
.racechip i{font-style:normal;opacity:.6;font-size:11px}
.abt{text-align:center;font:800 italic 19px/1 var(--display);opacity:0;transform:translateY(6px);transition:.22s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrolled .abt{opacity:1;transform:none}
.abr{display:flex;gap:6px;align-items:center}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font:700 12px/1 var(--body);letter-spacing:.5px}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--bar-ink);color:#0e131c}

/* ---------- screens ---------- */
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.scr{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 12px;display:grid;gap:18px}
.scr>*{min-width:0}
.in{animation:in .32s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.lt{padding-top:6px}
.lt h1{font-size:38px;letter-spacing:.2px}
.lt p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eb{font:700 11px/1 var(--body);letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.sh2{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px;margin:2px 4px 10px}
.sh2 h2{font-size:24px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.note{padding:12px 14px;border-radius:14px;background:var(--surface2);color:var(--muted);font-size:13.5px;margin:0}
.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}

/* ---------- hero scene ---------- */
.hero{position:relative;overflow:hidden;background:var(--sc-sky1);margin-top:-12px}
.hero svg.scene{width:100%;height:auto}
.hero .ov{position:relative;padding:14px max(16px,env(safe-area-inset-left,0px)) 16px;background:#0e131c;color:#fff}
.hero .ov::before{content:"";position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(to top,#0e131c,transparent)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font:800 italic 14px/1 var(--display);letter-spacing:.6px;background:var(--lead);color:var(--lead-ink);padding:5px 8px 4px;border-radius:7px;text-transform:uppercase}
.hero h1{font-size:32px;margin-top:8px}
.ar{color:var(--lead);padding:0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--body);padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips.dk .chip{background:var(--surface2);color:var(--ink2)}

/* ---------- tiles ---------- */
.dayw{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%}
.dayw svg.j{width:58px;height:58px;flex:none}
.dayw .t{flex:1;min-width:0}
.dayw b{display:block;font:800 italic 22px/1.05 var(--display)}
.dayw .tm{font:600 15px/1 var(--mono);text-align:right}
.dayw .tm small{display:block;font:600 10px/1.4 var(--body);letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.jt{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border-radius:20px;padding:14px 10px 14px 16px;color:#fff;position:relative;overflow:hidden;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;box-shadow:var(--shadow)}
.jt .jb{min-width:0;display:flex;flex-direction:column;gap:3px}
.jt.gen{background:linear-gradient(160deg,var(--lead),var(--lead2));color:var(--lead-ink)}
.jt.verde{background:linear-gradient(160deg,#16b065,#087a42)}
.jt.pois{background:#fdfdfd;color:#141414;background-image:radial-gradient(circle,#e3241b 0 6px,transparent 6.5px);background-size:26px 26px;background-position:4px 4px}
.jt.pois .jb{background:rgba(255,255,255,.92);border-radius:12px;padding:6px 8px;margin:-4px -4px 0}
.jt svg.j{width:76px;height:76px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28))}
.jt .l{font:700 10px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.jt b{font:800 italic 26px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jt .v{font:600 12px/1.3 var(--mono);opacity:.9}

/* podium */
.podw{position:relative;padding:18px 12px 0;background:radial-gradient(120% 90% at 50% 100%,var(--lead-soft),transparent 70%)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;position:relative}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.pod svg.j{width:64px;height:64px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22))}
.pod:nth-child(2) svg.j{width:82px;height:82px}
.pod .n{font:800 italic 19px/1 var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .g{font:600 11px/1 var(--mono);color:var(--muted);margin-bottom:12px}
.blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:8px;position:relative;
  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.blk::before{content:"";position:absolute;left:-6px;right:-6px;top:-7px;height:8px;border-radius:6px 6px 0 0;background:var(--c1);filter:brightness(1.12)}
.blk span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#141414;font:900 italic 21px/1 var(--display);box-shadow:0 3px 8px rgba(0,0,0,.2);position:relative}
.pod:nth-child(1) .blk{height:66px;--c1:#c9d1dc;--c2:#97a3b3}
.pod:nth-child(2) .blk{height:96px;--c1:#ffd75a;--c2:#e2a800}
.pod:nth-child(3) .blk{height:50px;--c1:#e3a06a;--c2:#b06a35}
.conf{position:absolute;inset:0;pointer-events:none;opacity:.8}
.podium{z-index:1}

/* route map */
.route{padding:12px 6px 6px}
.route svg{width:100%;height:auto}
.rleg{display:flex;flex-wrap:wrap;gap:10px;padding:2px 14px 12px;font:600 11px/1 var(--body);color:var(--muted)}
.rleg span{display:inline-flex;align-items:center;gap:5px}
.rleg i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* next stage */
.nx{display:grid;grid-template-columns:120px 1fr;gap:0;align-items:stretch;text-align:left;width:100%}
.nx svg{width:100%;height:100%;object-fit:cover}
.nx .t{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.nx b{font:800 italic 21px/1.05 var(--display)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 italic 16px/1 var(--display);letter-spacing:.5px;text-transform:uppercase;padding:13px 18px;border-radius:14px;background:var(--lead);color:var(--lead-ink);box-shadow:0 8px 18px -10px var(--lead)}
.cta:disabled{opacity:.5}
.cta.sec{background:var(--surface2);color:var(--ink);box-shadow:none}

/* countdown */
.cdw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.cdw div{background:var(--surface2);border-radius:14px;padding:12px 6px;text-align:center}
.cdw b{display:block;font:900 italic 38px/1 var(--display)}
.cdw small{font:700 10px/1 var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.mix{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px}
.mix div{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mix svg{width:100%;height:34px}
.mix b{font:900 italic 26px/1 var(--display)}
.mix small{font-size:11px;color:var(--muted);line-height:1.15}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface3);border-radius:12px;padding:3px;gap:3px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:9px;font:700 13px/1 var(--body);color:var(--muted)}
.seg button svg.j{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* leader banner */
.lb{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);overflow:hidden;color:var(--lead-ink);background:linear-gradient(135deg,var(--lead),var(--lead2))}
.lb.verde{background:linear-gradient(135deg,#16b065,#087a42);color:#fff}
.lb.pois{background:#fdfdfd;color:#141414;background-image:radial-gradient(circle,#e3241b 0 7px,transparent 7.5px);background-size:30px 30px}
.lb.pois .t{background:rgba(255,255,255,.93);border-radius:12px;padding:8px 10px}
.lb svg.j{width:96px;height:96px;flex:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.lb .t{min-width:0}
.lb h3{font-size:34px}
.lb .v{font:600 15px/1.2 var(--mono);margin-top:4px}
.lb .l{font:700 10px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;opacity:.85}

/* grouped list */
.gl{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gl li{position:relative}
.gl .row{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto 10px;align-items:center;gap:10px;padding:10px 12px 10px 14px;width:100%;text-align:left}
.gl li+li .row::before{content:"";position:absolute;top:0;left:92px;right:0;height:1px;background:var(--line)}
.gl .row:active{background:var(--surface2)}
.gl .pos{font:900 italic 24px/1 var(--display);text-align:center}
.gl svg.j{width:40px;height:40px}
.gl .nm b{display:block;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .bar{height:4px;border-radius:4px;background:var(--surface3);margin-top:6px;overflow:hidden}
.gl .bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--lead))}
.gl .r{text-align:right;font:600 13.5px/1.25 var(--mono)}
.gl .r small{display:block;font:500 11px/1.2 var(--mono);color:var(--muted)}
.chev{width:8px;height:14px;color:var(--muted);opacity:.6}
.mv{font:800 10.5px/1 var(--body);display:inline-flex;align-items:center;gap:1px;padding:2px 4px;border-radius:5px;margin-left:4px;vertical-align:1px}
.mv.up{color:var(--green);background:rgba(11,155,86,.12)}.mv.dn{color:var(--kom);background:rgba(227,36,27,.1)}.mv.eq{color:var(--muted);background:var(--surface2)}
.gl .ln{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.rd{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.rd svg{width:16px;height:16px}
.tg{font:700 10px/1 var(--body);padding:3px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tg.g{background:rgba(11,155,86,.13);color:var(--green)}.tg.k{background:rgba(227,36,27,.11);color:var(--kom)}.tg.b{background:var(--lead-soft);color:var(--ink)}.tg.x{background:rgba(227,36,27,.11);color:var(--kom)}

/* charts */
.chart{padding:14px 8px 10px}
.chart .hd{padding:0 8px 8px}
.chart .wrap{overflow-x:auto;scrollbar-width:thin}
.chart .wrap>svg{min-width:540px;width:100%;height:auto}
.legend{display:flex;gap:6px;overflow-x:auto;padding:2px 8px 10px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend button{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px 5px 5px;border-radius:999px;background:var(--surface2)}
.legend button svg.j{width:20px;height:20px}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* stage chips */
.sc{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.sc button{flex:none;width:66px;scroll-snap-align:center;border-radius:16px;padding:8px 6px 7px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.sc button b{font:900 italic 22px/1 var(--display)}
.sc button small{font:600 10px/1 var(--body);color:var(--muted)}
.sc button svg{width:52px;height:18px}
.sc button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sc button[aria-pressed="true"] small{color:inherit;opacity:.7}
.sc .st{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.sc .st.fut{background:var(--surface3)}.sc .st.neu{background:var(--amber)}
.sc .ck{position:absolute;top:4px;left:6px;font:900 11px/1 var(--body);color:var(--green)}
.alt{padding:12px 6px 6px}
.alt .hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 10px 4px}
.alt svg{width:100%;height:auto}
.gleg{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 10px;font:600 11px/1 var(--mono);color:var(--muted)}
.gleg span{display:inline-flex;align-items:center;gap:4px}
.gleg i{width:14px;height:8px;border-radius:2px;display:inline-block}

/* team cards */
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tc{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.tc .top{position:relative;height:118px;background:linear-gradient(160deg,var(--k1),var(--k2));display:grid;place-items:center;overflow:hidden}
.tc .top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 10px,transparent 10px 22px)}
.tc .top svg.j{width:98px;height:98px;position:relative;z-index:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));margin-top:10px}
.tc .rk{position:absolute;top:8px;left:8px;z-index:2;min-width:34px;height:34px;padding:0 6px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#141414;font:900 italic 21px/1 var(--display)}
.tc .rk.l{background:var(--lead);color:var(--lead-ink)}
.tc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tc b{font:800 italic 20px/1.05 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .ic{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tc .ic span{font:600 11px/1 var(--mono);padding:4px 6px;border-radius:7px;background:var(--surface2)}
.tc .wx{font:800 10px/1 var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--kom);margin-top:4px}
